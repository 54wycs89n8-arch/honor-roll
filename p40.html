<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>七年级北师 王兴华老师 表彰榜</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0 0 40px; background: #fbf6ef;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Source Han Sans SC", sans-serif;
    color: #3b2b20; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  header { background: linear-gradient(135deg, #b8271d 0%, #d9431f 45%, #e8a020 100%);
    color: #fff; padding: 36px 0 32px; margin-bottom: 28px; box-shadow: 0 6px 24px rgba(184,39,29,.22); }
  header .wrap { text-align: center; }
  .eyebrow { font-size: 13px; letter-spacing: 4px; opacity: .85; margin-bottom: 10px; }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 2px; font-weight: 800; }
  .sub { font-size: 14px; opacity: .92; }
  .board { margin-bottom: 34px; }
  .board-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; padding-left: 4px; }
  .board-head h2 { margin: 0; font-size: 21px; letter-spacing: 1px; }
  .board-head .badge { font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 700; background: #f6e3c4; color: #9a5b12; }
  .full-grid { display: flex; gap: 16px; flex-wrap: wrap; }
  .full-card { flex: 1 1 300px; text-align: center; padding: 24px 16px 20px;
    background: linear-gradient(160deg, #fff9ec 0%, #fff2d6 100%);
    border: 2px solid #e2b64f; border-radius: 16px; box-shadow: 0 4px 16px rgba(190,140,40,.18); }
  .crown { color: #d9a326; margin-bottom: 6px; }
  .fc-name { font-size: 24px; font-weight: 800; letter-spacing: 2px; color: #8a4b12; }
  .fc-score { font-size: 40px; font-weight: 800; color: #c0392b; line-height: 1.15; margin-top: 4px; }
  .fc-score .unit { font-size: 15px; margin-left: 2px; font-weight: 600; }
  .fc-tag { display: inline-block; margin-top: 8px; font-size: 12px; padding: 4px 12px; border-radius: 20px;
    background: linear-gradient(90deg, #d9a326, #b8271d); color: #fff; letter-spacing: 1px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 8px; }
  .item { display: flex; align-items: center; gap: 8px; background: #fff;
    border: 1px solid #eddcc4; border-left: 3px solid #e2b64f; border-radius: 10px; padding: 8px 12px; }
  .item.plain { border-left-color: #c9b79c; background: #fffdfa; }
  .rank { flex: 0 0 26px; height: 26px; line-height: 26px; text-align: center; font-size: 12px;
    font-weight: 700; border-radius: 50%; background: #f6e3c4; color: #9a5b12; }
  .rank.top { background: linear-gradient(135deg, #d9a326, #b8271d); color: #fff; }
  .name { flex: 1 1 auto; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score { font-size: 16px; font-weight: 800; color: #c0392b; }
  .score::after { content: "分"; font-size: 11px; font-weight: 600; margin-left: 1px; }
  .empty { padding: 30px; text-align: center; color: #a08c77; background: #fff; border: 1px dashed #e2d3bd; border-radius: 12px; }
  @media (max-width: 640px) { h1 { font-size: 21px; } .fc-name { font-size: 20px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
  @media print { body { background: #fff; } header { box-shadow: none; } .board { break-inside: avoid; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="eyebrow">平 行 线 · 表 彰 榜</div>
    <h1>七年级北师 王兴华老师</h1>
    <div class="sub">满分之星 · 高分达人 · 学习标兵</div>
  </div>
</header>
<div class="wrap">

      <span class="badge">得分率 90% 及以上（≥ 90 分）</span>
    </div>
    <div class="grid">
      <div class="item"><span class="rank top">1</span><span class="name">翟稳杰</span><span class="score">93</span></div>
    </div>

  <section class="board">
    <div class="board-head">

      <div class="item plain"><span class="rank">2</span><span class="name">王妙茹</span><span class="score">83</span></div>
      <div class="item plain"><span class="rank">4</span><span class="name">曹兴艺</span><span class="score">82.5</span></div>
      <div class="item plain"><span class="rank">5</span><span class="name">马梓涵</span><span class="score">82</span></div>
      <div class="item plain"><span class="rank">5</span><span class="name">Alice</span><span class="score">82</span></div>
      <div class="item plain"><span class="rank">5</span><span class="name">孙璐瑶</span><span class="score">82</span></div>
      <div class="item plain"><span class="rank">8</span><span class="name">臧林轩</span><span class="score">81</span></div>
      <div class="item plain"><span class="rank">8</span><span class="name">邢蕊音</span><span class="score">81</span></div>
      <div class="item plain"><span class="rank">8</span><span class="name">金晨曦</span><span class="score">81</span></div>
      <div class="item plain"><span class="rank">8</span><span class="name">邢芳菲</span><span class="score">81</span></div>
      <div class="item plain"><span class="rank">8</span><span class="name">王俊嘉</span><span class="score">81</span></div>
      <div class="item plain"><span class="rank">13</span><span class="name">杜若熙</span><span class="score">80</span></div>
      <div class="item plain"><span class="rank">13</span><span class="name">汪文彬</span><span class="score">80</span></div>
      <div class="item plain"><span class="rank">13</span><span class="name">贺致远</span><span class="score">80</span></div>
      <div class="item plain"><span class="rank">13</span><span class="name">紫桐</span><span class="score">80</span></div>
      <div class="item plain"><span class="rank">13</span><span class="name">张芮童</span><span class="score">80</span></div>
      <div class="item plain"><span class="rank">13</span><span class="name">雨彤</span><span class="score">80</span></div>
    </div>
  </section>

</div>
</body>
</html>
